<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Location</title>
    <link rel="stylesheet" href="css/main.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=call,map_pin_review"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="favicon/site.webmanifest" />
  </head>
  <body>
    <div class="intro" id="intro">
      <div class="intro-overlay"></div>
      <button id="enterBtn">Enter</button>
      <audio id="bgMusic" src="files/nomyn.mp3"></audio>
    </div>
    <div class="neon-overlay"></div>
    <div id="content" class="content-location">
      <header id="header" class="header-page"></header>
      <main id="main-location">
        <div class="location_container animate__animated animate__jackInTheBox">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d163930.7278572508!2d14.4656836!3d50.05974005!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x470b939c0970798b%3A0x400af0f66164090!2z0J_RgNCw0LPQsA!5e0!3m2!1sru!2scz!4v1762639135473!5m2!1sru!2scz"
            width="600"
            height="450"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            class="glass"
          ></iframe>
        </div>
      </main>
      <footer class="footer">
        <h3 class="footer_title primary-font">
          Have a project in mind? Get in touch.
        </h3>
        <form
          class="footer_input"
          action="https://formspree.io/f/mnjjqzan"
          method="POST"
        >
          <input
            class="footer_input-name glass rajdhani-bold"
            type="text"
            placeholder="Your name"
            name="name"
            id="name"
            required
          />
          <input
            class="footer_input-email glass rajdhani-bold"
            type="email"
            name="email"
            placeholder="Your email"
            required
            id="email"
          />
          <input
            class="footer_input-message glass rajdhani-bold"
            type="text"
            name="message"
            placeholder="Your messsage..."
            required
            id="message"
          />
          <button class="footer_input-btn glass" type="submit">Send</button>
        </form>
        <ul class="footer_items">
          <li id="propYear"></li>
          <li>
            <a href="https://github.com/Vladyslav-Karpenko"
              ><img
                width="50"
                height="50"
                src="https://img.icons8.com/ios/50/00ffff/github--v1.png"
                alt="github--v1"
            /></a>
          </li>
          <li>
            <a href="https://www.linkedin.com/in/vladyslav-karpenko-9734a72b8/"
              ><img
                width="50"
                height="50"
                src="https://img.icons8.com/ios/50/00ffff/linkedin.png"
                alt="linkedin"
            /></a>
          </li>
          <li>
            <a href="mailto:vladyslav.karpenko.cz@gmail.com">
              <img
                width="50"
                height="50"
                src="https://img.icons8.com/ios/50/00ffff/mail.png"
                alt="mail"
              />
            </a>
          </li>
        </ul>
      </footer>
    </div>
    <script src="main.js"></script>
  </body>
</html>
